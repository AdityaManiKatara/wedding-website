<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#D4AF37" opacity="0.2"/>
  
  <!-- Ganesh Silhouette -->
  <g fill="#8B4513">
    <!-- Head -->
    <ellipse cx="100" cy="80" rx="45" ry="40"/>
    
    <!-- Crown -->
    <path d="M 70 50 Q 100 30 130 50 L 125 55 Q 100 40 75 55 Z" fill="#DAA520"/>
    
    <!-- Trunk -->
    <path d="M 95 95 Q 85 110 75 120 Q 70 125 75 130 L 80 125 Q 90 115 95 105 Z"/>
    
    <!-- Eyes -->
    <circle cx="85" cy="75" r="4" fill="white"/>
    <circle cx="115" cy="75" r="4" fill="white"/>
    <circle cx="86" cy="75" r="2" fill="#2C2C2C"/>
    <circle cx="116" cy="75" r="2" fill="#2C2C2C"/>
    
    <!-- Body -->
    <ellipse cx="100" cy="135" rx="50" ry="45"/>
    
    <!-- Arms -->
    <ellipse cx="50" cy="125" rx="15" ry="35" transform="rotate(-20 50 125)"/>
    <ellipse cx="150" cy="125" rx="15" ry="35" transform="rotate(20 150 125)"/>
    
    <!-- Hands -->
    <circle cx="45" cy="155" r="10" fill="#CD853F"/>
    <circle cx="155" cy="155" r="10" fill="#CD853F"/>
    
    <!-- Tilak -->
    <path d="M 95 60 L 100 50 L 105 60 Z" fill="#DC143C"/>
  </g>
  
  <!-- Om Symbol -->
  <text x="100" y="190" font-family="serif" font-size="24" fill="#8B4513" text-anchor="middle" font-weight="bold">ॐ</text>
</svg>
